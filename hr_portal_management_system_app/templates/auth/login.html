{% extends 'layout.html' %} {%block title%}Log in{%endblock%} {% block content %}
<div class="container py-5 my-auto">
  <div class="row justify-content-center">
    <div class="col-12 sm:col-8 md:col-6 lg:col-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <!-- fingerprint logo -->
          <span class="d-inline-flex align-items-center justify-content-center bg-subtle-primary fg-primary rounded-circle p-2 mx-auto mb-3" aria-hidden="true">
            {% include "icons/fingerprint.html" with px=20 %}
          </span>
          <h1 class="h4 text-center mb-1">Welcome back</h1>
          <p class="text-center fg-2 mb-4">Log in to your HR workspace</p>
          <form action="{% url 'login' %}" method="POST" novalidate>
            {% csrf_token %}
            <div class="mb-4">
              <label for="id_email" class="form-label">Email</label>
              <input type="email" class="form-control" id="id_email" name="email" autocomplete="email" required />
            </div>
            <div class="mb-5">
              <label for="id_password" class="form-label">Password</label>
              <input type="password" class="form-control pe-5" id="id_password" name="password" autocomplete="current-password" required />
            </div>
            <button type="submit" class="btn btn-solid theme-primary flex-grow-1 d-inline-flex align-items-center justify-content-center gap-2">{% include "icons/log-in.html" with px=18 %} Log in</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
