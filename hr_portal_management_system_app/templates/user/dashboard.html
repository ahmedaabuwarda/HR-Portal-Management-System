{% extends 'layout.html' %} {%block title%}Dashboard{%endblock%} {% block content %}
<div class="container py-4 mt-7">
  <header class="d-flex flex-wrap align-items-center justify-content-between gap-4 mb-7">
    <div class="d-flex align-items-center gap-3">
      <span class="avatar avatar-subtle theme-primary fw-semibold" aria-hidden="true">{{ request.session.user_first_name|first|upper }}</span>
      <div>
        <h1 class="h3 mb-0">Welcome back, {{ request.session.user_first_name }}</h1>
        <p class="fg-2 small mb-0">Here's where your day stands.</p>
      </div>
    </div>
  </header>
</div>
{% endblock %}
