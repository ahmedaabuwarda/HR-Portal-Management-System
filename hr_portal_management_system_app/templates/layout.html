<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    {% load static %}
    <!-- website favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon-32.png' %}" />
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}" />
    <!-- Google Fonts  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet" />
    <!-- Bootstrap 6 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <script
      defer
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
    <!-- app css -->
    <link rel="stylesheet" type="text/css" href="{% static 'css/app.css' %}" />
    <!-- app js -->
    <!-- script for the whole toggle themes. -->
    <script defer type="text/javascript" src="{% static 'js/toggle_themes.js' %}"></script>
    <!-- Script for showing/hiding password -->
    <script defer type="text/javascript" src="{% static 'js/show_hide_password.js' %}"></script>
    <!-- register new fingerprint -->
    <script defer type="module" src="{% static 'js/register_fingerprint.js' %}"></script>
    <!-- login + checkin using fingerprint -->
    <script defer type="module" src="{% static 'js/login_checkin_using_fingerprint.js' %}"></script>
    <!-- Script for handling toasts -->
    <script type="module" src="{% static 'js/toast.js' %}"></script>
    <!-- Read by app.js when it posts to our fingerprint endpoints. -->
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <title>HR Management System | {% block title %}{% endblock %}</title>
  </head>
  <body class="bg-1 d-flex flex-column min-vh-100">
    <!-- Your header content here -->
    {% include 'partials/navbar.html' %} {% if messages %} {% include "partials/toast.html" %} {% endif %}

    <main id="content" class="flex-grow-1 d-flex flex-column">{% block content %} {% endblock %}</main>

    {% include 'partials/footer.html' %}
  </body>
</html>
